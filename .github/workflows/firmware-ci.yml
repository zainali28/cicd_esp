name: firmware ci

run-name: firmware ci pipeline

on: [push, pull_request]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  ESP32_CORE_VERSION: "3.3.11"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: check formatting
        run: |
          find . -regex '.*\.\(ino\|cpp\|hpp\|c\|h\)' \
            -not -path './build/*' \
            -exec clang-format --dry-run --Werror {} +

  static-analysis:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: setup arduino cli
        uses: arduino/setup-arduino-cli@v2

      - name: configure and install esp board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ env.ESP32_CORE_VERSION }}

      - name: generate compile database
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --only-compilation-database \
            --build-path ./build \
            .

      - name: run clang-tidy
        run: |
          find . -regex '.*\.\(cpp\|c\)' -not -path './build/*' \
            | xargs clang-tidy -p ./build || true

  unit-test:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: run host unit tests
        run: |
          echo "running host-based unit tests"
          # placeholder: replace with your real test runner, e.g.
          #   cd test && cmake -B build && cmake --build build && ctest --test-dir build
          # tests here must be hardware-independent (parsers, state machines, protocol logic)
          echo "no tests defined yet — placeholder passing"
          exit 0

  build:
    needs: [static-analysis, unit-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32
          - esp32s3
          - esp32c3
          - esp32c6
          - esp32h2
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup arduino cli
        uses: arduino/setup-arduino-cli@v2

      - name: cache esp32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ env.ESP32_CORE_VERSION }}

      - name: configure and install esp board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ env.ESP32_CORE_VERSION }}

      - name: build firmware for ${{ matrix.target }}
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:${{ matrix.target }} \
            --warnings all \
            --output-dir ./build/${{ matrix.target }} \
            --verbose \
            .

      - name: upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: ./build/${{ matrix.target }}/*.bin
          retention-days: 30
